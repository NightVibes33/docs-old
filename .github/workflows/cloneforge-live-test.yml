name: CloneForge v2 Live Verification

on:
  push:
    branches:
      - cloneforge-v2-deploy
    paths:
      - 'cloneforge-live-test/**'
      - '.github/workflows/cloneforge-live-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Correct nested action coverage assertion
        shell: python
        run: |
          from pathlib import Path

          path = Path('cloneforge-live-test/mcp-test.mjs')
          source = path.read_text()
          old = "check('product-graph-complete', Array.isArray(graph.screens) && graph.screens.length >= 4 && Array.isArray(graph.actions) && graph.actions.length >= 4, `${graph.screens?.length || 0} screens, ${graph.actions?.length || 0} actions`);"
          new = """const countNestedActions = value => {
            if (Array.isArray(value)) return value.reduce((sum, item) => sum + countNestedActions(item), 0);
            if (!value || typeof value !== 'object') return 0;
            return Object.entries(value).reduce((sum, [key, child]) => {
              const direct = /actions?$/i.test(key) && Array.isArray(child) ? child.length : 0;
              return sum + direct + countNestedActions(child);
            }, 0);
          };
          const mappedActionCount = countNestedActions(graph);
          const coverageGate = Array.isArray(audit.gates) ? audit.gates.find(gate => gate.id === 'screen-coverage') : undefined;
          check('product-graph-complete', Array.isArray(graph.screens) && graph.screens.length >= 4 && mappedActionCount >= 4 && coverageGate?.status === 'pass', `${graph.screens?.length || 0} screens, ${mappedActionCount} nested actions, ${coverageGate?.status || 'missing'} coverage gate`);"""
          if old not in source:
              raise SystemExit('Expected product graph assertion not found')
          path.write_text(source.replace(old, new))

      - name: Run live MCP protocol and PocketBot tests
        env:
          MCP_URL: https://cloneforge-mcp.vercel.app/api/mcp
        run: node cloneforge-live-test/mcp-test.mjs

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloneforge-v2-live-verification
          path: cloneforge-live-test/results
          if-no-files-found: error
          retention-days: 14
