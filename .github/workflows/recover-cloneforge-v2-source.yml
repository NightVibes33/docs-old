name: Recover CloneForge v2 Source

on:
  push:
    branches:
      - cloneforge-v2-deploy
    paths:
      - '.github/workflows/recover-cloneforge-v2-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble packed source manifest
        run: |
          set -euo pipefail
          cat \
            cloneforge-v2-deploy/source.part.00 \
            cloneforge-v2-deploy/source.part.01 \
            cloneforge-v2-deploy/source.part.02 \
            cloneforge-v2-deploy/source.part.03a \
            cloneforge-v2-deploy/source.part.03b \
            cloneforge-v2-deploy/source.part.04 \
            cloneforge-v2-deploy/source.part.05 \
            > cloneforge-v2-source.b64
          base64 --decode cloneforge-v2-source.b64 > cloneforge-v2-source.gz
          gzip --decompress --stdout cloneforge-v2-source.gz > cloneforge-v2-source.json
          file cloneforge-v2-source.json
          wc -c cloneforge-v2-source.json

      - name: Materialize source files
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const payload = JSON.parse(fs.readFileSync('cloneforge-v2-source.json', 'utf8'));
          const candidates = [
            payload,
            payload.files,
            payload.sourceFiles,
            payload.manifest,
            payload.manifest?.files,
            payload.project?.files,
          ];
          let files = candidates.find(value => Array.isArray(value));
          if (!files && payload && typeof payload === 'object') {
            const entries = Object.entries(payload).filter(([, value]) => typeof value === 'string');
            if (entries.some(([name]) => name.includes('/') || name.includes('.'))) {
              files = entries.map(([filePath, content]) => ({ path: filePath, content, encoding: 'utf8' }));
            }
          }
          if (!Array.isArray(files)) {
            console.error('Packed payload keys:', Object.keys(payload || {}));
            throw new Error('Could not locate source file array in packed manifest');
          }
          fs.rmSync('recovered-source', { recursive: true, force: true });
          fs.mkdirSync('recovered-source', { recursive: true });
          for (const file of files) {
            const filePath = file.path || file.name || file.filePath;
            if (!filePath || typeof filePath !== 'string') continue;
            const destination = path.resolve('recovered-source', filePath);
            const root = path.resolve('recovered-source') + path.sep;
            if (!destination.startsWith(root)) throw new Error(`Unsafe source path: ${filePath}`);
            fs.mkdirSync(path.dirname(destination), { recursive: true });
            const content = file.content ?? file.data ?? file.source ?? '';
            const encoding = file.encoding === 'base64' ? 'base64' : 'utf8';
            fs.writeFileSync(destination, Buffer.from(content, encoding));
          }
          console.log(`Materialized ${files.length} source entries`);
          NODE
          find recovered-source -type f -print | sort
          test -f recovered-source/package.json
          grep -n '"version"' recovered-source/package.json

      - name: Verify recovered server builds
        working-directory: recovered-source
        run: |
          npm install
          npm run build

      - name: Upload complete source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloneforge-v2-recovered-source
          path: |
            recovered-source
            cloneforge-v2-source.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
